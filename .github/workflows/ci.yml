name: Architecture preview release gate
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  fresh-clone:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fresh clone, dependencies, existing tests, demos, privacy and licenses
        # Give detached PR checkouts a local name for the disposable clone.
        run: |
          git switch -c preview-ci
          bash tools/ci/release-preview.sh --release
