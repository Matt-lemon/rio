name: Architecture preview release gate
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  fresh-clone:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Fresh clone, dependencies, existing tests, demos, privacy and licenses
        # Give detached PR checkouts a local name for the disposable clone.
        run: |
          git switch -c preview-ci
          bash tools/ci/release-preview.sh --release
